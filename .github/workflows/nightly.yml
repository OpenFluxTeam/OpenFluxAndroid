name: Nightly

# The second release channel, next to the main one (release.yml, tags vX.Y.Z).
# A nightly is a test build: a GitHub *prerelease* tagged
# nightly-<date>-<commit>, built from the OpenFlux/ and shared/ submodules
# pinned in the commit and signed with the same key as a main release, so it
# installs over one. The app's "Ночные сборки" switch (Settings > About) makes
# its update check look at these too; the main channel never sees them.
#
# It runs
#   - on a push to the `nightly` branch (that is how a test build is cut),
#   - every night, when `nightly` has a commit that has no build yet,
#   - from "Run workflow", on the chosen branch.
# The newest 7 nightlies are kept; older ones and their tags are deleted.
on:
  push:
    branches: [nightly]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ]; then
            sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/nightly | cut -f1)
            if [ -z "$sha" ]; then echo "No nightly branch: nothing to build"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            # A commit is built once: skip when a nightly already carries it.
            if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | grep -q -- "-${sha:0:7}$"; then
              echo "Nightly for ${sha:0:7} already published"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          else
            sha="$GITHUB_SHA"
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  android:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The upcoming main version (the last main release, one patch up) with a
          # nightly suffix: 2.2.0 -> 2.2.1-nightly.20261003. The version code only
          # reads X.Y.Z, so a nightly updates the previous one and the later main
          # release of that number updates it in turn.
          last=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          last="${last#v}"
          if ! [[ "$last" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then last="2.0.0"; fi
          IFS=. read -r major minor patch <<< "$last"
          date=$(date -u +%Y%m%d)
          short=$(git rev-parse --short=7 HEAD)
          echo "value=${major}.${minor}.$((patch + 1))-nightly.${date}" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-${date}-${short}" >> "$GITHUB_OUTPUT"
          echo "date=${date}" >> "$GITHUB_OUTPUT"
          echo "core=$(git -C OpenFlux rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version ${major}.${minor}.$((patch + 1))-nightly.${date}, commit ${short}, core $(git -C OpenFlux rev-parse --short HEAD)"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: OpenFlux/go.mod
          cache-dependency-path: OpenFlux/go.sum

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Add Android SDK tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e

      - name: Build the core (gomobile)
        run: bash scripts/build-android-core.sh

      - name: Tests
        run: ./gradlew --no-daemon :shared:jvmTest

      # A nightly is only worth publishing signed: an unsigned one cannot update
      # anything, and a different key would break the update path.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required to publish a nightly"; exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openflux-release.jks"
          chmod 600 "$RUNNER_TEMP/openflux-release.jks"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/openflux-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PappVersion=${{ steps.version.outputs.value }} :androidApp:assembleRelease

      - name: Verify APK signatures
        run: |
          find androidApp/build/outputs/apk/release -name '*.apk' -print0 | \
            xargs -0 -r -n1 "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose

      - name: Collect
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -name '*.apk' -print -exec cp {} dist/ \;
          for apk in dist/*.apk; do mv "$apk" "dist/OpenFluxAndroid-${{ steps.version.outputs.value }}-$(basename "$apk")"; done
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenFluxAndroid-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes="Ночная сборка: тестовая, может ломаться. Не основной выпуск — включается переключателем «Ночные сборки» в настройках. APK универсальный или под архитектуру устройства. Ядро: \`${{ steps.version.outputs.core }}\`. Контрольные суммы — в \`SHA256SUMS.txt\`."
          # What is queued for the next main release, if CHANGELOG.md says anything.
          pending=$(awk 'index($0, "## [Unreleased]")==1 { f=1; next } index($0, "## [")==1 { f=0 } f' CHANGELOG.md | sed '/./,$!d')
          [ -n "$pending" ] && notes="$pending"$'\n\n'"$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --prerelease --notes "$notes"
          else
            gh release create "$tag" dist/* \
              --prerelease \
              --target "${{ needs.plan.outputs.sha }}" \
              --title "OpenFluxAndroid nightly ${{ steps.version.outputs.date }} (${tag##*-})" \
              --notes "$notes"
          fi

      - name: Keep the newest 7 nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("nightly-"))] | sort_by(.created_at) | reverse | .[7:] | .[].tag_name' |
            while read -r old; do
              echo "removing old nightly $old"
              gh release delete "$old" --cleanup-tag --yes
            done
